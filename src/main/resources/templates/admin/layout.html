<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <!-- Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap JS Bundle from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- HTMX from CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.1/dist/htmx.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="d-flex">

<!-- Sidebar -->
<div class="bg-dark text-white p-3" style="width: 250px;">
    <h3>Admin Panel</h3>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a href="#" class="nav-link text-white"
               hx-get="/admin/users/get-all"
               hx-target="#main-content"
               hx-swap="innerHTML">Users</a>
        </li>
        <li class="nav-item">
            <a href="#" class="nav-link text-white"
               hx-get="/admin/products"
               hx-target="#main-content"
               hx-swap="innerHTML">Products</a>
        </li>
        <li class="nav-item">
            <a href="#" class="nav-link text-white"
               hx-get="/admin/orders"
               hx-target="#main-content"
               hx-swap="innerHTML">Orders</a>
        </li>
    </ul>
</div>

<!-- Main Content -->
<div id="main-content" class="flex-grow-1 p-4">
    <h2>Welcome to Admin Panel</h2>
    <p>Select a section from the sidebar.</p>
</div>

<script>
    function confirmDelete(userId, btn) {
        Swal.fire({
            title: 'Are you sure?',
            text: 'This action cannot be undone.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Yes, delete it!'
        }).then((result) => {
            if (result.isConfirmed) {
                const row = btn.closest('tr');
                htmx.ajax('DELETE', `/admin/users/delete/${userId}`, {
                    target: row,
                    swap: 'outerHTML'
                });

                Swal.fire('Deleted!', 'The user has been deleted.', 'success');
            }
        });
    }
</script>
</body>
</html>
