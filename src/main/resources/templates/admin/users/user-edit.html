<div th:fragment="form">
    <h2>Add User</h2>
    <form th:hx-post="@{/admin/users/edit/{id}(id=${user.id})}"
          hx-target="#main-content"
          hx-swap="innerHTML">

        <div class="mb-3">
            <label class="form-label">Firstname</label>
            <input type="text" name="firstName" class="form-control" th:value="${user.firstName}">
        </div>

        <div class="mb-3">
            <label class="form-label">Lastname</label>
            <input type="text" name="lastName" class="form-control" th:value="${user.lastName}">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" th:value="${user.email}">
        </div>

        <div class="mb-3">
            <label class="form-label">Phone number</label>
            <input type="text" name="phoneNumber" class="form-control" th:value="${user.phoneNumber}">
        </div>

        <div class="mb-3">
            <label class="form-label">Gender</label>
            <input type="number" name="genderIndex" class="form-control" th:value="${user.genderIndex}">
        </div>

        <div class="mb-3">
            <label class="form-label">Birthday</label>
            <input type="date" name="birthday" class="form-control" th:value="${user.birthday}">
        </div>

        <button type="submit" class="btn btn-success">Update</button>
        <button type="button" class="btn btn-secondary"
                hx-get="/admin/users/get-all"
                hx-target="#main-content"
                hx-swap="innerHTML">Cancel</button>
    </form>
</div>
