<div th:fragment="content">
    <h2>Addresses</h2>
    <button class="btn btn-primary mb-3"
            hx-get="/admin/addresses/create"
            hx-target="#main-content"
            hx-swap="innerHTML">+ Add Address</button>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th><th>Region</th><th>City</th><th>District</th><th>Street</th><th>HomeNumber</th><th>Address Type</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${addresses}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.region}"></td>
            <td th:text="${a.city}"></td>
            <td th:text="${a.district}"></td>
            <td th:text="${a.street}"></td>
            <td th:text="${a.homeNumber}"></td>
            <td th:switch="${a.addressTypeIndex}">
                <span th:case="0">User</span>
                <span th:case="1">Market</span>
                <span th:case="*">Unknown</span>
            </td>
            <td>
                <button class="btn btn-sm btn-warning"
                        th:hx-get="@{/admin/addresses/edit/{id}(id=${a.id})}"
                        hx-target="#main-content"
                        hx-swap="innerHTML">Edit</button>
                <button class="btn btn-sm btn-danger"
                        hx-target="closest tr"
                        hx-swap="outerHTML"
                        th:onclick="|confirmDelete('addresses', ${a.id}, this)|">
                    Delete
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
