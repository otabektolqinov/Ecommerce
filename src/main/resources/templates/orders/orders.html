<div th:fragment="content">
    <h2>Orders</h2>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th><th>Status</th><th>Address</th><th>Delivery Type</th><th>Order Date</th><th>Order Price</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:switch="${order.orderStatusIndex}">
                <span th:case="0">New</span>
                <span th:case="1">On the way</span>
                <span th:case="2">Arrived</span>
                <span th:case="3">Waiting</span>
                <span th:case="4">Given</span>
                <span th:case="4">Canceled</span>
            </td>
            <td th:text="${order.address.getFullAddress()}"></td>
            <td th:switch="${order.deliveryTypeIndex}">
                <span th:case="0">IN_PERSON</span>
                <span th:case="1">DELIVERY</span>
            </td>
            <td th:text="${order.orderDate}"></td>
            <td th:text="${order.orderPrice}"></td>
        </tr>
        </tbody>
    </table>
</div>
